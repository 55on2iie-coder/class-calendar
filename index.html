        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const PERIODS = ["1교시", "2교시", "3교시", "4교시", "5교시", "6교시", "7교시", "8교시", "동아리", "방과후"];

        const CLASS_COLOR_PALETTES = [
            { bg: 'bg-emerald-50/90', border: 'border-emerald-300', tagBorder: 'border-emerald-200', badgeBg: 'bg-emerald-600' },
            { bg: 'bg-indigo-50/90', border: 'border-indigo-300', tagBorder: 'border-indigo-200', badgeBg: 'bg-indigo-600' },
            { bg: 'bg-amber-50/90', border: 'border-amber-300', tagBorder: 'border-amber-200', badgeBg: 'bg-amber-600' },
            { bg: 'bg-rose-50/90', border: 'border-rose-300', tagBorder: 'border-rose-200', badgeBg: 'bg-rose-600' },
            { bg: 'bg-purple-50/90', border: 'border-purple-300', tagBorder: 'border-purple-200', badgeBg: 'bg-purple-600' },
            { bg: 'bg-sky-50/90', border: 'border-sky-300', tagBorder: 'border-sky-200', badgeBg: 'bg-sky-600' },
            { bg: 'bg-teal-50/90', border: 'border-teal-300', tagBorder: 'border-teal-200', badgeBg: 'bg-teal-600' },
            { bg: 'bg-fuchsia-50/90', border: 'border-fuchsia-300', tagBorder: 'border-fuchsia-200', badgeBg: 'bg-fuchsia-600' },
            { bg: 'bg-orange-50/90', border: 'border-orange-300', tagBorder: 'border-orange-200', badgeBg: 'bg-orange-600' },
            { bg: 'bg-cyan-50/90', border: 'border-cyan-300', tagBorder: 'border-cyan-200', badgeBg: 'bg-cyan-600' },
            { bg: 'bg-pink-50/90', border: 'border-pink-300', tagBorder: 'border-pink-200', badgeBg: 'bg-pink-600' },
            { bg: 'bg-violet-50/90', border: 'border-violet-300', tagBorder: 'border-violet-200', badgeBg: 'bg-violet-600' },
            { bg: 'bg-lime-50/90', border: 'border-lime-300', tagBorder: 'border-lime-200', badgeBg: 'bg-lime-600' },
            { bg: 'bg-blue-50/90', border: 'border-blue-300', tagBorder: 'border-blue-200', badgeBg: 'bg-blue-600' },
            { bg: 'bg-red-50/90', border: 'border-red-300', tagBorder: 'border-red-200', badgeBg: 'bg-red-600' }
        ];

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-class-calendar';
        let db = null;
        let auth = null;
        let currentUser = null;
        let isSyncingWithCloud = false;

        const realToday = new Date();
        let currentYear = realToday.getFullYear();
        let currentMonth = realToday.getMonth();
        let currentView = 'calendar';

        let appState = {
            grades: ["1학년", "2학년", "3학년"],
            classes: ["1반", "2반", "3반"],
            units: ["주생활과 주거 문화", "오리엔테이션", "디지털 디자인 기초", "의복의 구성과 관리"],
            entries: []
        };

        let selectedFormGrades = ["1학년"];
        let selectedFormClasses = ["1반"];
        let selectedFormPeriods = ["1교시"];
        let activeContextMenuEntryId = null;
        let draggedEntryId = null;

        let listPreset = 'month';
        let listStartDate = '';
        let listEndDate = '';

        function getClassColor(entry) {
            if (!entry) return CLASS_COLOR_PALETTES[0];
            const totalGradesCount = appState.grades && appState.grades.length > 0 ? appState.grades.length : 3;
            
            let gradeStr = '공통';
            if (entry.grades && entry.grades.length > 0) {
                if (entry.grades.length === totalGradesCount) {
                    gradeStr = '전학년';
                } else {
                    gradeStr = [...entry.grades].sort().join('+');
                }
            }
            
            let classArr = entry.classes || (entry.className ? entry.className.split(', ') : []);
            let classStr = classArr.length > 0 ? [...classArr].sort().join('+') : '공통';

            const key = `${gradeStr}__${classStr}`;
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = (hash << 5) - hash + key.charCodeAt(i);
                hash |= 0;
            }
            return CLASS_COLOR_PALETTES[Math.abs(hash) % CLASS_COLOR_PALETTES.length];
        }

        function formatDateISO(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function loadLocalState() {
            const saved = localStorage.getItem('class_progress_calendar_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                } catch(e) {
                    console.error("Failed to parse saved state", e);
                }
            }
        }

        function saveLocalState() {
            localStorage.setItem('class_progress_calendar_state', JSON.stringify(appState));
        }

        async function initCloudSync() {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            updateSyncBadge(true, "클라우드 동기화 연결됨");
                            subscribeCloudData();
                        }
                    });
                } catch (e) {
                    console.warn("Firebase initialization skipped or offline:", e);
                    updateSyncBadge(false, "로컬 모드로 작동 중");
                }
            } else {
                updateSyncBadge(false, "로컬 모드로 작동 중");
            }
        }

        function updateSyncBadge(isOnline, text) {
            const statusEl = document.getElementById('cloudSyncStatus');
            const textEl = document.getElementById('syncStatusText');
            if (statusEl && textEl) {
                textEl.innerText = text;
                if (isOnline) {
                    statusEl.className = "hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/80 mr-1";
                } else {
                    statusEl.className = "hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200 mr-1";
                }
            }
        }

        function subscribeCloudData() {
            if (!db || !currentUser) return;

            // 1) Config Sync (Grades, Classes, Units)
            const configRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'config');
            onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.grades) appState.grades = data.grades;
                    if (data.classes) appState.classes = data.classes;
                    if (data.units) appState.units = data.units;
                    populateGradeFilters();
                    populateClassFilters();
                    saveLocalState();
                    refreshView();
                } else {
                    // Seed initial config to cloud
                    setDoc(configRef, {
                        grades: appState.grades,
                        classes: appState.classes,
                        units: appState.units
                    }).catch(console.error);
                }
            }, (err) => console.error("Config sync error:", err));

            // 2) Entries Collection Sync
            const entriesColRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'entries');
            onSnapshot(entriesColRef, (querySnap) => {
                const cloudEntries = [];
                querySnap.forEach((docSnap) => {
                    cloudEntries.push({ id: docSnap.id, ...docSnap.data() });
                });

                // If cloud is brand new and local has entries, seed cloud
                if (cloudEntries.length === 0 && appState.entries.length > 0) {
                    appState.entries.forEach(entry => saveEntryToCloud(entry));
                } else {
                    appState.entries = cloudEntries;
                    saveLocalState();
                    refreshView();
                }
            }, (err) => console.error("Entries sync error:", err));
        }

        async function saveConfigToCloud() {
            if (!db || !currentUser) return;
            try {
                const configRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'config');
                await setDoc(configRef, {
                    grades: appState.grades,
                    classes: appState.classes,
                    units: appState.units
                });
            } catch(e) {
                console.error("Failed to save config to cloud:", e);
            }
        }

        async function saveEntryToCloud(entry) {
            if (!db || !currentUser) return;
            try {
                const entryRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'entries', entry.id);
                await setDoc(entryRef, entry);
            } catch(e) {
                console.error("Failed to save entry to cloud:", e);
            }
        }

        async function deleteEntryFromCloud(entryId) {
            if (!db || !currentUser) return;
            try {
                const entryRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'entries', entryId);
                await deleteDoc(entryRef);
            } catch(e) {
                console.error("Failed to delete entry from cloud:", e);
            }
        }

        window.onload = function() {
            loadLocalState();
            if (!appState.grades || appState.grades.length === 0) {
                appState.grades = ["1학년", "2학년", "3학년"];
            }
            populateYearDropdown();
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            
            populateGradeFilters();
            populateClassFilters();
            populateUnitFilters();
            setListPreset('month', false);
            renderCalendar();
            renderList();

            // Start Firebase Auth & Live Sync
            initCloudSync();
        };

        function populateYearDropdown() {
            const selectYear = document.getElementById('selectYear');
            selectYear.innerHTML = '';
            const startYear = Math.min(2020, currentYear - 2);
            const endYear = 2060;
            for (let y = startYear; y <= endYear; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = y;
                selectYear.appendChild(opt);
            }
        }

        function populateGradeFilters() {
            const filterGrade = document.getElementById('filterGrade');
            const currentFilterVal = filterGrade.value;
            filterGrade.innerHTML = '<option value="">전체 학년</option>';
            appState.grades.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = g;
                filterGrade.appendChild(opt);
            });
            filterGrade.value = currentFilterVal;
        }

        function populateClassFilters() {
            const filterClass = document.getElementById('filterClass');
            const currentFilterVal = filterClass.value;
            filterClass.innerHTML = '<option value="">전체 반</option>';
            appState.classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                filterClass.appendChild(opt);
            });
            filterClass.value = currentFilterVal;
        }

        function populateUnitFilters() {
            const filterUnit = document.getElementById('filterUnit');
            if (!filterUnit) return;
            const currentFilterVal = filterUnit.value;
            filterUnit.innerHTML = '<option value="">전체 단원</option>';
            appState.units.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.innerText = u;
                filterUnit.appendChild(opt);
            });
            filterUnit.value = currentFilterVal;
        }

        function switchView(view) {
            currentView = view;
            const calView = document.getElementById('calendarView');
            const listView = document.getElementById('listView');
            const btnCal = document.getElementById('viewBtnCalendar');
            const btnList = document.getElementById('viewBtnList');

            if (view === 'calendar') {
                calView.classList.remove('hidden');
                listView.classList.add('hidden');
                btnCal.className = "px-3 py-1 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-2xs transition";
                btnList.className = "px-3 py-1 text-xs font-medium rounded-lg text-slate-600 hover:text-slate-900 transition";
                renderCalendar();
            } else {
                calView.classList.add('hidden');
                listView.classList.remove('hidden');
                btnList.className = "px-3 py-1 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-2xs transition";
                btnCal.className = "px-3 py-1 text-xs font-medium rounded-lg text-slate-600 hover:text-slate-900 transition";
                renderList();
            }
        }

        function setListPreset(preset, shouldRender = true) {
            listPreset = preset;
            const today = new Date();
            const startInput = document.getElementById('listStartDate');
            const endInput = document.getElementById('listEndDate');

            if (preset === 'all') {
                listStartDate = '';
                listEndDate = '';
            } else if (preset === 'month') {
                const firstDay = new Date(currentYear, currentMonth, 1);
                const lastDay = new Date(currentYear, currentMonth + 1, 0);
                listStartDate = formatDateISO(firstDay);
                listEndDate = formatDateISO(lastDay);
            } else if (preset === 'week') {
                const oneWeekAgo = new Date(today);
                oneWeekAgo.setDate(today.getDate() - 7);
                listStartDate = formatDateISO(oneWeekAgo);
                listEndDate = formatDateISO(today);
            } else if (preset === '1month') {
                const oneMonthAgo = new Date(today);
                oneMonthAgo.setMonth(today.getMonth() - 1);
                listStartDate = formatDateISO(oneMonthAgo);
                listEndDate = formatDateISO(today);
            }

            if (startInput) startInput.value = listStartDate;
            if (endInput) endInput.value = listEndDate;

            updateListPresetButtonsUI();
            if (shouldRender) renderList();
        }

        function updateListPresetButtonsUI() {
            const presets = ['All', 'Month', 'Week', '1Month', 'Custom'];
            presets.forEach(p => {
                const btn = document.getElementById('btnPreset' + p);
                if (!btn) return;
                if (listPreset === p.toLowerCase()) {
                    btn.className = "px-2.5 py-1 text-[11px] font-bold rounded-lg bg-white text-indigo-600 shadow-2xs transition";
                } else {
                    btn.className = "px-2.5 py-1 text-[11px] font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
                }
            });
        }

        function handleListCustomDateChange() {
            listPreset = 'custom';
            listStartDate = document.getElementById('listStartDate').value;
            listEndDate = document.getElementById('listEndDate').value;
            updateListPresetButtonsUI();
            renderList();
        }

        function goToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            if (listPreset === 'month') {
                setListPreset('month', false);
            }
            refreshView();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            if (listPreset === 'month') {
                setListPreset('month', false);
            }
            refreshView();
        }

        function onYearMonthChange() {
            currentYear = parseInt(document.getElementById('selectYear').value, 10);
            currentMonth = parseInt(document.getElementById('selectMonth').value, 10);
            if (listPreset === 'month') {
                setListPreset('month', false);
            }
            refreshView();
        }

        function refreshView() {
            if (currentView === 'calendar') renderCalendar();
            else renderList();
        }

        function handleSearch() {
            refreshView();
        }

        function handleFilterChange() {
            refreshView();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const searchKey = document.getElementById('searchInput').value.trim().toLowerCase();
            const filterGrade = document.getElementById('filterGrade').value;
            const filterClass = document.getElementById('filterClass').value;
            const filterUnit = document.getElementById('filterUnit').value;

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
            const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0);
            
            let startDate = new Date(firstDayOfMonth);
            let dayOfWeek = startDate.getDay();
            let diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            startDate.setDate(startDate.getDate() + diffToMonday);

            let endDate = new Date(lastDayOfMonth);
            let endDayOfWeek = endDate.getDay();
            let diffToSaturday = endDayOfWeek === 0 ? -1 : 6 - endDayOfWeek;
            endDate.setDate(endDate.getDate() + diffToSaturday);

            let curr = new Date(startDate);
            while (curr <= endDate) {
                for (let i = 0; i < 6; i++) {
                    let cellDate = new Date(curr);
                    let dateISO = formatDateISO(cellDate);
                    let isCurrentMonth = cellDate.getMonth() === currentMonth;

                    const cell = document.createElement('div');
                    cell.className = `p-2 flex flex-col bg-white transition hover:bg-slate-50/50 relative ${!isCurrentMonth ? 'opacity-40 bg-slate-50/30' : ''}`;
                    
                    cell.onclick = () => openRegisterModal(dateISO);

                    cell.ondragover = (e) => e.preventDefault();
                    cell.ondragenter = (e) => {
                        e.preventDefault();
                        cell.classList.add('bg-indigo-50/50', 'border-2', 'border-indigo-400');
                    };
                    cell.ondragleave = () => {
                        cell.classList.remove('bg-indigo-50/50', 'border-2', 'border-indigo-400');
                    };
                    cell.ondrop = (e) => {
                        e.preventDefault();
                        cell.classList.remove('bg-indigo-50/50', 'border-2', 'border-indigo-400');
                        if (draggedEntryId) {
                            moveEntryToDate(draggedEntryId, dateISO);
                        }
                    };

                    const dateHeader = document.createElement('div');
                    dateHeader.className = "flex items-center justify-between mb-1.5";
                    
                    const dayNumSpan = document.createElement('span');
                    
                    const todayISO = formatDateISO(new Date());
                    const isToday = (todayISO === dateISO);

                    const isSaturday = (cellDate.getDay() === 6);
                    let dayColorClass = isToday 
                        ? 'bg-indigo-600 text-white shadow-xs' 
                        : (isSaturday ? 'text-indigo-600 font-bold' : 'text-slate-700');

                    dayNumSpan.className = `text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center ${dayColorClass}`;
                    dayNumSpan.innerText = cellDate.getDate();
                    dateHeader.appendChild(dayNumSpan);

                    let dayEntries = appState.entries.filter(e => e.date === dateISO);

                    dayEntries = dayEntries.filter(entry => {
                        if (filterGrade && (!entry.grades || !entry.grades.includes(filterGrade))) return false;
                        if (filterClass) {
                            const entryClasses = entry.classes || (entry.className ? entry.className.split(', ') : []);
                            if (!entryClasses.includes(filterClass)) return false;
                        }
                        if (filterUnit && entry.unit !== filterUnit) return false;
                        if (searchKey) {
                            const matchContent = entry.content.toLowerCase().includes(searchKey);
                            const matchUnit = (entry.unit || '').toLowerCase().includes(searchKey);
                            const matchNotes = (entry.notes || '').toLowerCase().includes(searchKey);
                            if (!matchContent && !matchUnit && !matchNotes) return false;
                        }
                        return true;
                    });

                    dayEntries.sort((a, b) => {
                        const pA = a.periods && a.periods.length > 0 ? a.periods[0] : "";
                        const pB = b.periods && b.periods.length > 0 ? b.periods[0] : "";
                        return PERIODS.indexOf(pA) - PERIODS.indexOf(pB);
                    });

                    if (dayEntries.length > 0) {
                        const countBadge = document.createElement('span');
                        countBadge.className = "text-[10px] font-semibold text-slate-400";
                        countBadge.innerText = `${dayEntries.length}건`;
                        dateHeader.appendChild(countBadge);
                    }

                    cell.appendChild(dateHeader);

                    const cardsContainer = document.createElement('div');
                    cardsContainer.className = "space-y-1.5 flex-1";

                    dayEntries.forEach(entry => {
                        const card = document.createElement('div');
                        const palette = getClassColor(entry);

                        card.className = `p-2 rounded-xl border text-xs cursor-grab active:cursor-grabbing shadow-2xs transition hover:shadow-md ${palette.bg} ${palette.border}`;
                        card.draggable = true;

                        card.ondragstart = () => {
                            draggedEntryId = entry.id;
                            card.style.opacity = '0.4';
                        };
                        card.ondragend = () => {
                            draggedEntryId = null;
                            card.style.opacity = '1';
                        };

                        card.onclick = (e) => {
                            e.stopPropagation();
                            openRegisterModalForEdit(entry);
                        };

                        card.oncontextmenu = (e) => showContextMenu(e, entry);

                        const totalGradesCount = appState.grades && appState.grades.length > 0 ? appState.grades.length : 3;
                        let gradeText = '';
                        if (entry.grades && entry.grades.length > 0) {
                            if (entry.grades.length === totalGradesCount) {
                                gradeText = '전학년';
                            } else {
                                gradeText = entry.grades.join(', ');
                            }
                        }
                        const classArr = entry.classes || (entry.className ? entry.className.split(', ') : []);
                        const classText = classArr.join(', ');
                        let tagText = '';
                        if (gradeText && classText) {
                            tagText = `${gradeText} ${classText}`;
                        } else if (gradeText) {
                            tagText = gradeText;
                        } else if (classText) {
                            tagText = classText;
                        }
                        const periodText = (entry.periods && entry.periods.length > 0) ? entry.periods.join(', ') : '';

                        const shouldShowNotes = (entry.showNotes !== false) && entry.notes && entry.notes.trim() !== '';

                        card.innerHTML = `
                            <div class="flex items-center justify-between gap-1 mb-1 flex-wrap">
                                ${tagText ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold text-slate-700 bg-white/80 border ${palette.tagBorder}">${tagText}</span>` : '<span></span>'}
                                <span class="px-1.5 py-0.5 rounded-md text-[10px] font-semibold text-white ${palette.badgeBg}">${escapeHtml(periodText)}</span>
                            </div>
                            <p class="font-medium text-slate-800 line-clamp-2 leading-tight">${escapeHtml(entry.content)}</p>
                            ${shouldShowNotes ? `<p class="text-[10px] text-slate-500 mt-1 pt-1 border-t border-slate-200/50 truncate"><i class="fa-regular fa-sticky-note mr-1 text-slate-400"></i>${escapeHtml(entry.notes)}</p>` : ''}
                        `;
                        cardsContainer.appendChild(card);
                    });

                    cell.appendChild(cardsContainer);
                    grid.appendChild(cell);

                    curr.setDate(curr.getDate() + 1);
                }
                curr.setDate(curr.getDate() + 1);
            }
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            if (!container) return;
            container.innerHTML = '';

            const searchKey = document.getElementById('searchInput').value.trim().toLowerCase();
            const filterGrade = document.getElementById('filterGrade').value;
            const filterClass = document.getElementById('filterClass').value;
            const filterUnit = document.getElementById('filterUnit').value;

            let allEntries = [...appState.entries];

            allEntries = allEntries.filter(entry => {
                if (listStartDate && entry.date < listStartDate) return false;
                if (listEndDate && entry.date > listEndDate) return false;

                if (filterGrade && (!entry.grades || !entry.grades.includes(filterGrade))) return false;
                if (filterClass) {
                    const entryClasses = entry.classes || (entry.className ? entry.className.split(', ') : []);
                    if (!entryClasses.includes(filterClass)) return false;
                }
                if (filterUnit && entry.unit !== filterUnit) return false;
                if (searchKey) {
                    const matchContent = entry.content.toLowerCase().includes(searchKey);
                    const matchUnit = (entry.unit || '').toLowerCase().includes(searchKey);
                    const matchNotes = (entry.notes || '').toLowerCase().includes(searchKey);
                    if (!matchContent && !matchUnit && !matchNotes) return false;
                }
                return true;
            });

            allEntries.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (allEntries.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl border border-slate-200 p-12 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p class="text-xs font-medium">선택한 기간 내에 등록된 수업 진도가 없습니다.</p>
                    </div>
                `;
                return;
            }

            allEntries.forEach(entry => {
                const palette = getClassColor(entry);
                const item = document.createElement('div');
                item.className = `p-4 rounded-2xl border transition hover:shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${palette.bg} ${palette.border}`;
                item.onclick = () => openRegisterModalForEdit(entry);
                item.oncontextmenu = (e) => showContextMenu(e, entry);

                const totalGradesCount = appState.grades && appState.grades.length > 0 ? appState.grades.length : 3;
                let gradeText = '';
                if (entry.grades && entry.grades.length > 0) {
                    if (entry.grades.length === totalGradesCount) {
                        gradeText = '전학년';
                    } else {
                        gradeText = entry.grades.join(', ');
                    }
                }
                const classArr = entry.classes || (entry.className ? entry.className.split(', ') : []);
                const classText = classArr.join(', ');
                let badgeLabel = '';
                if (gradeText && classText) badgeLabel = `${gradeText} ${classText}`;
                else if (gradeText) badgeLabel = gradeText;
                else if (classText) badgeLabel = classText;

                item.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 text-xs flex-wrap gap-y-1">
                            <span class="font-bold text-slate-900">${escapeHtml(entry.date)}</span>
                            ${badgeLabel ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-white border ${palette.tagBorder}">${escapeHtml(badgeLabel)}</span>` : ''}
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold text-white ${palette.badgeBg}">${entry.periods ? entry.periods.join(', ') : ''}</span>
                            <span class="text-slate-500 font-medium">| ${escapeHtml(entry.unit || '')}</span>
                        </div>
                        <p class="text-sm font-semibold text-slate-800">${escapeHtml(entry.content)}</p>
                        ${entry.notes ? `<p class="text-xs text-slate-500"><i class="fa-regular fa-sticky-note mr-1"></i>${escapeHtml(entry.notes)}</p>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function openRegisterModal(dateISO) {
            document.getElementById('editEntryId').value = '';
            document.getElementById('modalTitle').innerText = '새 수업 진도 등록';
            document.getElementById('submitBtn').innerText = '진도 등록';
            document.getElementById('deleteEntryBtn').classList.add('hidden');

            document.getElementById('inputDate').value = dateISO || formatDateISO(new Date());
            document.getElementById('inputContent').value = '';
            document.getElementById('inputNotes').value = '';
            document.getElementById('inputShowNotes').checked = true;

            selectedFormGrades = appState.grades.length > 0 ? [appState.grades[0]] : ["1학년"];
            selectedFormClasses = appState.classes.length > 0 ? [appState.classes[0]] : ["1반"];
            selectedFormPeriods = ["1교시"];

            populateModalDropdowns();
            renderGradeChips();
            renderClassChips();
            renderPeriodChips();

            document.getElementById('registerModal').classList.remove('hidden');
        }

        function openRegisterModalForEdit(entry) {
            document.getElementById('editEntryId').value = entry.id;
            document.getElementById('modalTitle').innerText = '수업 진도 수정';
            document.getElementById('submitBtn').innerText = '수정 완료';
            document.getElementById('deleteEntryBtn').classList.remove('hidden');

            document.getElementById('inputDate').value = entry.date;
            document.getElementById('inputContent').value = entry.content || '';
            document.getElementById('inputNotes').value = entry.notes || '';
            document.getElementById('inputShowNotes').checked = entry.showNotes !== false;

            selectedFormGrades = entry.grades ? [...entry.grades] : ["1학년"];
            selectedFormClasses = entry.classes ? [...entry.classes] : (entry.className ? entry.className.split(', ') : []);
            selectedFormPeriods = entry.periods ? [...entry.periods] : ["1교시"];

            populateModalDropdowns();
            // Populate the unit options first, then restore the entry's saved unit.
            const unitSelect = document.getElementById('selectUnit');
            if (entry.unit && appState.units.includes(entry.unit)) {
                unitSelect.value = entry.unit;
            } else if (appState.units.length > 0) {
                unitSelect.value = appState.units[0];
            }
            renderGradeChips();
            renderClassChips();
            renderPeriodChips();

            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function populateModalDropdowns() {
            const unitSelect = document.getElementById('selectUnit');
            unitSelect.innerHTML = '';
            appState.units.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.innerText = u;
                unitSelect.appendChild(opt);
            });
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderClassChips() {
            const container = document.getElementById('classChipsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (appState.classes.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400">등록된 반이 없습니다. (상단 "반 관리"에서 추가 가능)</span>';
                return;
            }

            appState.classes.forEach(c => {
                const isSelected = selectedFormClasses.includes(c);
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.onclick = () => toggleClassChip(c);
                chip.className = `px-3 py-1.5 rounded-xl text-xs font-semibold transition border ${
                    isSelected 
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }`;
                chip.innerHTML = `${isSelected ? '<i class="fa-solid fa-check mr-1 text-[10px]"></i>' : ''}${c}`;
                container.appendChild(chip);
            });
        }

        function toggleClassChip(c) {
            if (selectedFormClasses.includes(c)) {
                selectedFormClasses = selectedFormClasses.filter(item => item !== c);
            } else {
                selectedFormClasses.push(c);
            }
            renderClassChips();
        }

        function renderGradeChips() {
            const container = document.getElementById('gradeChipsContainer');
            if (!container) return;
            container.innerHTML = '';

            const gradesList = appState.grades && appState.grades.length > 0 ? appState.grades : ["1학년", "2학년", "3학년"];

            const isAllSelected = (selectedFormGrades.length === gradesList.length);
            const allChip = document.createElement('button');
            allChip.type = 'button';
            allChip.onclick = () => toggleAllGradesChip();
            allChip.className = `px-3.5 py-1.5 rounded-2xl text-xs font-semibold transition border ${
                isAllSelected 
                ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
            }`;
            allChip.innerHTML = `${isAllSelected ? '<i class="fa-solid fa-check mr-1 text-[10px]"></i>' : ''}전학년`;
            container.appendChild(allChip);

            gradesList.forEach(g => {
                const isSelected = selectedFormGrades.includes(g);
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.onclick = () => toggleGradeChip(g);
                chip.className = `px-3.5 py-1.5 rounded-2xl text-xs font-semibold transition border ${
                    isSelected 
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }`;
                chip.innerHTML = `${isSelected ? '<i class="fa-solid fa-check mr-1 text-[10px]"></i>' : ''}${g}`;
                container.appendChild(chip);
            });
        }

        function toggleAllGradesChip() {
            const gradesList = appState.grades && appState.grades.length > 0 ? appState.grades : ["1학년", "2학년", "3학년"];
            if (selectedFormGrades.length === gradesList.length) {
                selectedFormGrades = [];
            } else {
                selectedFormGrades = [...gradesList];
            }
            renderGradeChips();
        }

        function toggleGradeChip(g) {
            if (selectedFormGrades.includes(g)) {
                selectedFormGrades = selectedFormGrades.filter(item => item !== g);
            } else {
                selectedFormGrades.push(g);
            }
            renderGradeChips();
        }

        function renderPeriodChips() {
            const container = document.getElementById('periodChipsContainer');
            if (!container) return;
            container.innerHTML = '';
            PERIODS.forEach(p => {
                const isSelected = selectedFormPeriods.includes(p);
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.onclick = () => togglePeriodChip(p);
                chip.className = `px-3 py-1.5 rounded-xl text-xs font-semibold transition border ${
                    isSelected 
                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                }`;
                chip.innerHTML = `${isSelected ? '<i class="fa-solid fa-check mr-1 text-[10px]"></i>' : ''}${p}`;
                container.appendChild(chip);
            });
        }

        function togglePeriodChip(p) {
            if (selectedFormPeriods.includes(p)) {
                if (selectedFormPeriods.length > 1) {
                    selectedFormPeriods = selectedFormPeriods.filter(item => item !== p);
                }
            } else {
                selectedFormPeriods.push(p);
            }
            renderPeriodChips();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            const entryId = document.getElementById('editEntryId').value;
            const date = document.getElementById('inputDate').value;
            const unit = document.getElementById('selectUnit').value;
            const content = document.getElementById('inputContent').value.trim();
            const notes = document.getElementById('inputNotes').value.trim();
            const showNotes = document.getElementById('inputShowNotes').checked;

            const className = selectedFormClasses.join(', ');

            if (!content) {
                showToast("수업 내용을 입력해주세요.");
                return;
            }

            let targetEntry = null;

            if (entryId) {
                const index = appState.entries.findIndex(e => e.id === entryId);
                if (index !== -1) {
                    targetEntry = {
                        ...appState.entries[index],
                        date,
                        className,
                        classes: [...selectedFormClasses],
                        grades: [...selectedFormGrades],
                        periods: [...selectedFormPeriods],
                        unit,
                        content,
                        notes,
                        showNotes
                    };
                    appState.entries[index] = targetEntry;
                }
                showToast("수업 진도가 수정되었습니다.");
            } else {
                targetEntry = {
                    id: 'entry_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                    date,
                    className,
                    classes: [...selectedFormClasses],
                    grades: [...selectedFormGrades],
                    periods: [...selectedFormPeriods],
                    unit,
                    content,
                    notes,
                    showNotes
                };
                appState.entries.push(targetEntry);
                showToast("새 수업 진도가 등록되었습니다.");
            }

            saveLocalState();
            if (targetEntry) {
                await saveEntryToCloud(targetEntry);
            }
            closeRegisterModal();
            refreshView();
        }

        async function handleDeleteFromModal() {
            const entryId = document.getElementById('editEntryId').value;
            if (entryId) {
                if (!confirm('이 수업 진도를 정말 삭제하시겠습니까?')) return;
                appState.entries = appState.entries.filter(e => e.id !== entryId);
                saveLocalState();
                await deleteEntryFromCloud(entryId);
                closeRegisterModal();
                refreshView();
                showToast("진도가 삭제되었습니다.");
            }
        }

        async function moveEntryToDate(entryId, newDateISO) {
            const entry = appState.entries.find(e => e.id === entryId);
            if (entry) {
                entry.date = newDateISO;
                saveLocalState();
                await saveEntryToCloud(entry);
                refreshView();
                showToast(`진도가 ${newDateISO}로 이동되었습니다.`);
            }
        }

        function showContextMenu(e, entry) {
            e.preventDefault();
            activeContextMenuEntryId = entry.id;

            const menu = document.getElementById('contextMenu');
            menu.style.top = `${e.clientY}px`;
            menu.style.left = `${e.clientX}px`;
            menu.classList.remove('hidden');

            const closeListener = () => {
                menu.classList.add('hidden');
                document.removeEventListener('click', closeListener);
            };
            setTimeout(() => document.addEventListener('click', closeListener), 100);
        }

        function contextActionEdit() {
            const entry = appState.entries.find(e => e.id === activeContextMenuEntryId);
            if (entry) openRegisterModalForEdit(entry);
        }

        async function contextActionDuplicate() {
            const entry = appState.entries.find(e => e.id === activeContextMenuEntryId);
            if (entry) {
                const duplicate = {
                    ...entry,
                    id: 'entry_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                    content: entry.content
                };
                appState.entries.push(duplicate);
                saveLocalState();
                await saveEntryToCloud(duplicate);
                refreshView();
                showToast("수업 진도 복사본이 생성되었습니다.");
            }
        }

        async function contextActionDelete() {
            if (activeContextMenuEntryId) {
                const deleteId = activeContextMenuEntryId;
                if (!confirm('이 수업 진도를 정말 삭제하시겠습니까?')) return;
                appState.entries = appState.entries.filter(e => e.id !== deleteId);
                saveLocalState();
                await deleteEntryFromCloud(deleteId);
                refreshView();
                showToast("진도가 삭제되었습니다.");
            }
        }

        function openGradeManageModal() {
            renderGradeList();
            document.getElementById('gradeManageModal').classList.remove('hidden');
        }
        function closeGradeManageModal() {
            document.getElementById('gradeManageModal').classList.add('hidden');
            populateGradeFilters();
        }
        function renderGradeList() {
            const container = document.getElementById('gradeListContainer');
            if (!container) return;
            container.innerHTML = '';
            appState.grades.forEach(g => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-800";
                const label = document.createElement('span');
                label.textContent = g;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'text-rose-500 hover:text-rose-700 transition';
                button.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                button.addEventListener('click', () => removeGradeByName(g));
                row.appendChild(label);
                row.appendChild(button);
                container.appendChild(row);
            });
        }
        async function addGradeName() {
            const input = document.getElementById('newGradeNameInput');
            const val = input.value.trim();
            if (val && !appState.grades.includes(val)) {
                appState.grades.push(val);
                input.value = '';
                saveLocalState();
                await saveConfigToCloud();
                renderGradeList();
                showToast("새 학년이 추가되었습니다.");
            }
        }
        async function removeGradeByName(name) {
            if (!confirm(`'${name}' 학년을 삭제하시겠습니까? 기존 진도 기록은 삭제되지 않습니다.`)) return;
            appState.grades = appState.grades.filter(g => g !== name);
            selectedFormGrades = selectedFormGrades.filter(g => g !== name);
            saveLocalState();
            await saveConfigToCloud();
            renderGradeList();
            renderGradeChips();
            showToast("학년이 삭제되었습니다.");
        }

        function openClassManageModal() {
            renderClassList();
            document.getElementById('classManageModal').classList.remove('hidden');
        }
        function closeClassManageModal() {
            document.getElementById('classManageModal').classList.add('hidden');
            populateClassFilters();
        }
        function renderClassList() {
            const container = document.getElementById('classListContainer');
            if (!container) return;
            container.innerHTML = '';
            appState.classes.forEach(c => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-800";
                const label = document.createElement('span');
                label.textContent = c;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'text-rose-500 hover:text-rose-700 transition';
                button.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                button.addEventListener('click', () => removeClassByName(c));
                row.appendChild(label);
                row.appendChild(button);
                container.appendChild(row);
            });
        }
        async function addClassName() {
            const input = document.getElementById('newClassNameInput');
            const val = input.value.trim();
            if (val && !appState.classes.includes(val)) {
                appState.classes.push(val);
                input.value = '';
                saveLocalState();
                await saveConfigToCloud();
                renderClassList();
                showToast("새 반이 추가되었습니다.");
            }
        }
        async function removeClassByName(name) {
            if (!confirm(`'${name}' 반을 삭제하시겠습니까? 기존 진도 기록은 삭제되지 않습니다.`)) return;
            appState.classes = appState.classes.filter(c => c !== name);
            selectedFormClasses = selectedFormClasses.filter(c => c !== name);
            saveLocalState();
            await saveConfigToCloud();
            renderClassList();
            renderClassChips();
            showToast("반이 삭제되었습니다.");
        }

        function openUnitManageModal() {
            renderUnitList();
            document.getElementById('unitManageModal').classList.remove('hidden');
        }
        function closeUnitManageModal() {
            document.getElementById('unitManageModal').classList.add('hidden');
            populateModalDropdowns();
            populateUnitFilters();
            refreshView();
        }
        function renderUnitList() {
            const container = document.getElementById('unitListContainer');
            if (!container) return;
            container.innerHTML = '';
            appState.units.forEach(u => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-800";
                const label = document.createElement('span');
                label.className = 'truncate pr-2';
                label.textContent = u;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'text-rose-500 hover:text-rose-700 transition shrink-0';
                button.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                button.addEventListener('click', () => removeUnitByName(u));
                row.appendChild(label);
                row.appendChild(button);
                container.appendChild(row);
            });
        }
        async function addUnitName() {
            const input = document.getElementById('newUnitNameInput');
            const val = input.value.trim();
            if (val && !appState.units.includes(val)) {
                appState.units.push(val);
                input.value = '';
                saveLocalState();
                await saveConfigToCloud();
                renderUnitList();
                populateModalDropdowns();
                populateUnitFilters();
                showToast("새 단원이 추가되었습니다.");
            }
        }
        async function removeUnitByName(name) {
            if (appState.units.length <= 1) {
                showToast("최소 1개 이상의 단원이 필요합니다.");
                return;
            }
            if (!confirm(`'${name}' 단원을 삭제하시겠습니까? 기존 진도 기록은 삭제되지 않습니다.`)) return;
            appState.units = appState.units.filter(u => u !== name);
            saveLocalState();
            await saveConfigToCloud();
            renderUnitList();
            populateModalDropdowns();
            populateUnitFilters();
            refreshView();
            showToast("단원이 삭제되었습니다.");
        }
        function deleteCurrentUnit() {
            const select = document.getElementById('selectUnit');
            const val = select.value;
            if (appState.units.length <= 1) {
                showToast("최소 1개 이상의 단원이 필요합니다.");
                return;
            }
            removeUnitByName(val);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.openGradeManageModal = openGradeManageModal;
        window.closeGradeManageModal = closeGradeManageModal;
        window.addGradeName = addGradeName;
        window.removeGradeByName = removeGradeByName;

        window.openClassManageModal = openClassManageModal;
        window.closeClassManageModal = closeClassManageModal;
        window.addClassName = addClassName;
        window.removeClassByName = removeClassByName;

        window.openUnitManageModal = openUnitManageModal;
        window.closeUnitManageModal = closeUnitManageModal;
        window.addUnitName = addUnitName;
        window.removeUnitByName = removeUnitByName;
        window.deleteCurrentUnit = deleteCurrentUnit;

        window.openRegisterModal = openRegisterModal;
        window.closeRegisterModal = closeRegisterModal;
        window.handleFormSubmit = handleFormSubmit;
        window.handleDeleteFromModal = handleDeleteFromModal;

        window.goToToday = goToToday;
        window.changeMonth = changeMonth;
        window.onYearMonthChange = onYearMonthChange;
        window.switchView = switchView;
        window.handleSearch = handleSearch;
        window.handleFilterChange = handleFilterChange;

        window.setListPreset = setListPreset;
        window.handleListCustomDateChange = handleListCustomDateChange;

        window.contextActionEdit = contextActionEdit;
        window.contextActionDuplicate = contextActionDuplicate;
        window.contextActionDelete = contextActionDelete;
    </script>
